<!-- =========================================================
     WAQAR REAL ESTATE — Forms Page Snippet for waqar.runasp.net
     صفحة جاهزة لدمج نماذج البيع والشراء في موقع وقار
     =========================================================
     HOW TO USE:
     1. Run "2️⃣ إنشاء نماذج Google Forms تلقائياً" in your Google Sheet
     2. Open ⚙️ الإعدادات sheet and copy the embed URLs from column C (cells C7 & C8)
        which already end with ?embedded=true
     3. Replace REPLACE_WITH_SELLER_EMBED_URL and REPLACE_WITH_BUYER_EMBED_URL below
     4. Drop this snippet into a new ASP.NET View (e.g. Requests.cshtml or SellBuy.aspx).
     ========================================================= -->

<style>
  .waqar-portal {
    max-width: 960px;
    margin: 30px auto;
    padding: 0 16px;
    direction: rtl;
    font-family: 'Cairo', 'Tajawal', Tahoma, Arial, sans-serif;
  }
  .waqar-portal-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .waqar-portal-header h1 {
    color: #1a237e;
    font-size: 28px;
    margin-bottom: 8px;
  }
  .waqar-portal-header p {
    color: #555555;
    font-size: 15px;
  }
  .waqar-tabs {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .waqar-tab-btn {
    padding: 12px 26px;
    border-radius: 10px;
    border: 2px solid #1a237e;
    background: #ffffff;
    color: #1a237e;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .waqar-tab-btn.active {
    background: #1a237e;
    color: #ffffff;
  }
  .waqar-form-box {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
  }
  .waqar-form-panel { display: none; }
  .waqar-form-panel.active { display: block; }
  .waqar-form-panel iframe {
    width: 100%;
    height: 1150px;
    border: 0;
  }
</style>

<section class="waqar-portal">
  <div class="waqar-portal-header">
    <h1>وقار للاستثمار العقاري — الإسكندرية</h1>
    <p>سجّل طلبك للشراء أو أضف عقارك للبيع، وسيقوم فريقنا بربطك بأفضل الفرص فوراً</p>
  </div>

  <div class="waqar-tabs">
    <button type="button" class="waqar-tab-btn active" onclick="switchWaqarForm('buyer', this)">
      🔑 أبحث عن عقار للشراء
    </button>
    <button type="button" class="waqar-tab-btn" onclick="switchWaqarForm('seller', this)">
      🏠 أضف عقارك للبيع
    </button>
  </div>

  <div class="waqar-form-box">
    <div id="waqar-buyer-panel" class="waqar-form-panel active">
      <iframe src="REPLACE_WITH_BUYER_EMBED_URL" loading="lazy">جاري تحميل النموذج...</iframe>
    </div>
    <div id="waqar-seller-panel" class="waqar-form-panel">
      <iframe src="REPLACE_WITH_SELLER_EMBED_URL" loading="lazy">جاري تحميل النموذج...</iframe>
    </div>
  </div>
</section>

<script>
  function switchWaqarForm(type, btn) {
    document.querySelectorAll('.waqar-tab-btn').forEach(function (b) { b.classList.remove('active'); });
    document.querySelectorAll('.waqar-form-panel').forEach(function (p) { p.classList.remove('active'); });
    btn.classList.add('active');
    var panel = document.getElementById('waqar-' + type + '-panel');
    if (panel) panel.classList.add('active');
  }
</script>
