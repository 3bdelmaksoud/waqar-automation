<style>
  .waqar-wa-container {
    position: fixed;
    bottom: 22px;
    left: 22px;
    z-index: 9999;
    font-family: 'Cairo', 'Tajawal', Tahoma, Arial, sans-serif;
    direction: rtl;
  }
  .waqar-wa-popup {
    display: none;
    width: 285px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .waqar-wa-popup.open {
    display: block;
    animation: waqarSlideUp 0.2s ease-out;
  }
  @keyframes waqarSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .waqar-wa-header {
    background: #075e54;
    color: #ffffff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .waqar-wa-header h4 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
  }
  .waqar-wa-header small {
    display: block;
    font-size: 11px;
    color: #c8e6c9;
    margin-top: 2px;
  }
  .waqar-wa-close {
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .waqar-wa-body {
    padding: 14px;
    background: #f4f6f5;
    font-size: 13px;
    color: #222222;
    line-height: 1.6;
  }
  .waqar-wa-actions {
    padding: 12px 14px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .waqar-wa-action-btn {
    display: block;
    text-align: center;
    padding: 9px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: opacity 0.2s;
  }
  .waqar-wa-action-btn:hover { opacity: 0.9; }
  .waqar-btn-buy {
    background: #25d366;
    color: #ffffff;
  }
  .waqar-btn-sell {
    background: #1a237e;
    color: #ffffff;
  }
  .waqar-wa-fab {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #25d366;
    color: #ffffff;
    border: none;
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.45);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  .waqar-wa-fab:hover { transform: scale(1.06); }
</style>
